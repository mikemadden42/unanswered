version: "2"

linters:
  default: none
  enable:
    - bodyclose # Catches unclosed HTTP response bodies
    - errcheck # Catches your file.Close errors
    - gosec # Catches your G304 security issue
    - revive # Catches your missing comment issues
    - govet # Standard Go vetting
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
  exclusions:
    paths:
      - third_party
      - builtin
      - examples

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mikemadden42
